services:
  model:
    image: vllm/vllm-openai:v0.22.1
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --tensor-parallel-size=1
      # Sized from docs/grading-workload-spec.json's published workload shape,
      # not copied from the BTC sample's 32768: worst-case context at a
      # conversation's last turn is shared_system_prefix_tokens (1000) +
      # per_conversation_prefix_tokens (1000) + user_turns_per_conversation (6)
      # x (new_user_tokens_per_turn 150 + output_tokens_per_turn_pinned 300)
      # = 4700 tokens (see workload/schema.py summarize_trace()). 6144 leaves
      # ~30% headroom for chat-template/special-token overhead. Freeing this
      # much context budget vs. 32768 leaves far more VRAM for KV cache blocks
      # -> should support materially higher --max-num-seqs; re-sweep after
      # changing this. If the grading spec file changes, regenerate the
      # trace and recompute this number - don't leave it stale.
      #
      # Hardcoded, not ${VAR:-default} - BTC's grader spawns the container
      # directly (see "spawn contestant container" in its error output)
      # rather than invoking `docker compose up`, so it never performs
      # Compose's own ${...} interpolation. A literal '${MAX_MODEL_LEN:-6144}'
      # string reaching api_server.py caused a submission failure
      # ("invalid human_readable_int_or_auto value"). Use
      # docker-compose.override.yml (git-ignored, local-only) if you want
      # env-var overrides while sweeping locally.
      - --max-model-len=6144
      - --gpu-memory-utilization=0.95
      # Host has only 8GB system RAM (MiG H200 slice). --swap-space was
      # removed in vllm/vllm-openai:v0.22.1 (V1 engine uses recomputation-
      # based preemption, not CPU swap) - KV cache offload to host RAM is
      # now opt-in via --kv-offloading-size, which defaults to disabled, so
      # no flag is needed here to get the same "never spill to host RAM" behavior.
      - --enable-prefix-caching
      # --- Carried-forward optimization flags: re-validate against the
      # pinned vllm/vllm-openai:v0.22.1 image before submitting (flags churn
      # across vLLM releases) - see docs/warmup/OPTIMIZATION_NOTES.md.
      # FP8 is the ERS-oriented default (hardcoded, not ${VAR:-default} -
      # see the --max-model-len comment above for why: BTC's grader doesn't
      # perform Compose env-var interpolation).
      - --kv-cache-dtype=fp8
      # The full 70-conversation / 420-request trace selected 80/3072:
      # ers_median=0.6797, p95 TTFT=99.2ms, mean TPOT=3.00ms, with
      # 420/420 successes. It beat both 80/2048 and 80/4096.
      # Re-sweep if the trace shape, max-model-len, or target hardware changes.
      - --max-num-seqs=80
      - --max-num-batched-tokens=3072
      - --enable-chunked-prefill
      # Renamed from --scheduler-policy in vllm/vllm-openai:v0.22.1.
      - --scheduling-policy=priority
      # 3 CPU cores only - skip per-request log formatting overhead.
      # --disable-log-requests was replaced by --enable-log-requests
      # (default false) in v0.22.1, so omitting it already gets this behavior.
    ports:
      - "8000:8000"
    shm_size: "2g"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
